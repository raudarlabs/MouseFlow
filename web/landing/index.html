<!-- The landing, hivelink.si. __SITE_URL__ is replaced at build time by vite.landing.config.ts with SITE_URL
     (default https://hivelink.si, no trailing slash): canonical and Open Graph URLs must be absolute, and a
     preview deployment should not claim to be the canonical site unless it is told to. -->
<title>Hivelink — a live AI agent for QA and IT</title>
<meta name="description" content="Write tests in plain words; a live AI agent runs them nightly on real Windows and Mac screens, and the machine decides pass or fail with evidence. Coming soon.">
<link rel="canonical" href="__SITE_URL__/">

<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hivelink">
<meta property="og:url" content="__SITE_URL__/">
<meta property="og:title" content="Hivelink — Every machine. One hive.">
<meta property="og:description" content="A live AI agent on every Windows PC, Mac and test VM. Tests in plain words, run every night on the real screen and judged by the machine with evidence — plus always-on machines that take jobs for IT. Coming soon.">
<meta property="og:image" content="__SITE_URL__/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:image" content="__SITE_URL__/og.png">
<!-- MOTION, DECIDED BEFORE THE FIRST PAINT. html.js says a script runs; html.motion says the visitor's
     system allows motion and the URL has no ?still (the screenshot switch). The hive art's fade and the
     ambient loops key off html.motion from the first frame; nothing is hidden by it - a reveal also needs
     html.reveals, which only the running bundle adds (src/landing/motion/), so a page whose bundle never
     arrives is still the finished page. src/landing/motion/state.ts answers the same question after
     hydration and follows a live change of the setting. -->
<script>(function(h){h.classList.add('js');try{if(!/[?&]still(=|&|$)/.test(location.search)&&matchMedia('(prefers-reduced-motion: no-preference)').matches)h.classList.add('motion')}catch(e){}})(document.documentElement)</script>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The app's three faces, the same request as web/index.html: Sora for headings, Manrope for text,
     JetBrains Mono for labels and code. -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400..800&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<!-- What the page is, for search engines: the product and who makes it. No ratings, no prices - there are
     none yet, and structured data that invents them is worse than none. The FAQPage is added at build time

{"@type":"SoftwareApplication","@id":"__SITE_URL__/#software","name":"Hivelink","url":"__SITE_URL__/","image":"__SITE_URL__/og.png","applicationCategory":"DeveloperApplication","operatingSystem":"Windows, macOS","publisher":{"@id":"__SITE_URL__/#organization"},"description":"A live AI agent for each Windows and macOS computer or test VM, with one account over all of them. It carries out tests and jobs written in plain words on its own screen, in any app. The machine decides each check from the accessibility tree or the web page, so every test gets a verdict — passed, failed a check or no verdict — with evidence frames kept. Use it from the web app, from Claude over MCP, or from Telegram."}
]}
